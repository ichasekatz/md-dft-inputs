[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "md-dft-inputs"
version = "0.1.0"
description = "LAMMPS lattice input generation and VASP input templates for MD/DFT simulations"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12"
authors = [{ name = "Chase Katz", email = "ichasekatz@tamu.edu" }]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "ty>=0.0.1a13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/md_dft_inputs"]

[tool.ruff]
line-length = 130
force-exclude = true

[tool.ruff.lint]
select = ["A", "B", "C4", "D", "E", "ERA", "F", "FA", "I", "ICN", "N", "PL", "PTH", "Q", "SIM", "TC", "UP", "W"]
ignore = ["E501", "PLR0913", "PLR0917", "PLR2004"]
pydocstyle.convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
